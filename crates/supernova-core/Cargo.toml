[package]
name = "supernova-core"
version = "0.1.0"
edition = "2024"
description = "Supernova core library and CLI for configuring HATOR gaming mice on Linux"

[[bin]]
name = "supernova-cli"
path = "src/bin/supernova-cli.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
hidapi = { version = "2.6", default-features = false, features = ["linux-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
